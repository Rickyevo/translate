[package]
name = "translate"
version = "0.2.4"
edition = "2021"
description = "Live translations of WeChat Input Method candidates on Windows"
license = "MIT"
publish = false

[[bin]]
name = "Translate"
path = "src/main.rs"

[dependencies]
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Registry", "Win32_System_DataExchange", "Win32_System_Memory",
  "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_Security", "Win32_UI_Shell",
] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
